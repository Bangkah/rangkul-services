name: Pemeriksaan RANGKUL

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    name: Verifikasi kode dan image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pasang dependensi API inti
        run: pip install -r core-api/requirements.txt
      - name: Periksa kualitas kode dan kompilasi API inti
        working-directory: core-api
        run: |
          ruff check main.py
          ruff format --check main.py
          python -m py_compile main.py
          python -m json.tool postman_collection.json > /dev/null
          python -c "import main; paths=set(main.app.openapi()['paths']); required={'/health','/v1/chat','/v1/hospitals/{hospital_id}','/v1/hospitals/{hospital_id}/floorplans','/v1/hospitals/{hospital_id}/route','/admin/hospitals/{hospital_id}/floorplans','/admin/wayfinding/{entry_id}/publish'}; assert required <= paths, (required - paths)"
      - name: Bangun image API inti
        run: docker build -t rangkul-core-api ./core-api
